name: release

# Triggered by pushing a tag matching v*, e.g. `git tag v0.1.0 && git push --tags`.
# Builds self-contained binaries with htslib linked statically:
#   - linux-x86_64: fully static (htslib, compression libs and glibc), so it
#     runs on any distribution, including older HPC clusters.
#   - macos-arm64 / macos-x86_64: htslib static; only system libraries
#     (libz, libbz2, libSystem) are linked dynamically, so it runs on a stock
#     Mac. Built without lzma (not in the macOS SDK): CRAM files using the
#     lzma codec can't be read; everything else can.
# Run it by hand (Actions > release > Run workflow) to test the builds without
# publishing. Pre-release tags (containing '-', e.g. v0.1.0-rc1) skip the
# Homebrew bump.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  HTSLIB_VERSION: '1.21'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: macos-arm64
            os: macos-latest
            arch: arm64
          - target: macos-x86_64
            os: macos-latest       # cross-compiled on Apple Silicon
            arch: x86_64
            host: x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install htslib build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # zlib/bz2/lzma (for htslib) + libc6-dev provides the static archives
          # (.a) the fully-static (-static) link needs, including libc.a.
          sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev libc6-dev

      - name: Fetch htslib ${{ env.HTSLIB_VERSION }}
        run: |
          set -euo pipefail
          V="${HTSLIB_VERSION}"
          curl -fsSL -o "htslib-${V}.tar.bz2" \
            "https://github.com/samtools/htslib/releases/download/${V}/htslib-${V}.tar.bz2"
          tar xjf "htslib-${V}.tar.bz2"
          mv "htslib-${V}" htslib

      - name: Build static htslib (Linux)
        if: runner.os == 'Linux'
        run: |
          cd htslib
          ./configure --disable-libcurl --disable-plugins
          make -j"$(nproc)" lib-static

      - name: Build static htslib (macOS ${{ matrix.arch }})
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cd htslib
          # Nothing optional, so nothing from Homebrew can be picked up.
          ./configure ${{ matrix.host && format('--host={0}', matrix.host) || '' }} \
            CC="cc -arch ${{ matrix.arch }}" \
            --disable-libcurl --disable-plugins --disable-lzma --disable-gcs \
            --disable-s3 --without-libdeflate
          make -j"$(sysctl -n hw.ncpu)" lib-static

      - name: Build bpp-seqs (Linux, fully static)
        if: runner.os == 'Linux'
        run: |
          # FULLY static (-static): bundle htslib, its compression deps
          # (bz2/lzma/z), AND glibc, so there is no runtime dependency of any
          # kind. Required for HPC portability: the runner's glibc is NEWER than
          # most clusters'. Safe because --disable-libcurl/--disable-plugins mean
          # no network, NSS, or dlopen paths.
          make HTSLIB_A="$PWD/htslib/libhts.a" HTSLIB_INC="$PWD/htslib" \
               HTSLIB_STATIC_DEPS="-lbz2 -llzma -lz -lpthread -lm" \
               EXTRA_LDFLAGS="-static"

      - name: Build bpp-seqs (macOS ${{ matrix.arch }})
        if: runner.os == 'macOS'
        run: |
          make HTSLIB_A="$PWD/htslib/libhts.a" HTSLIB_INC="$PWD/htslib" \
               HTSLIB_STATIC_DEPS="-lbz2 -lz -lpthread -lm" \
               EXTRA_CFLAGS="-arch ${{ matrix.arch }}" EXTRA_LDFLAGS="-arch ${{ matrix.arch }}"

      - name: Check linkage
        shell: bash
        run: |
          set -euo pipefail
          file bpp-seqs
          if [ "$RUNNER_OS" = Linux ]; then
            file bpp-seqs | grep -q 'statically linked' \
              || { echo "ERROR: not statically linked; it will break on older-glibc hosts" >&2; exit 1; }
          else
            file bpp-seqs | grep -q "${{ matrix.arch }}"
            otool -L bpp-seqs
            if otool -L bpp-seqs | tail -n +2 | grep -v -E '^\s+(/usr/lib/|/System/)'; then
              echo "ERROR: linked against a library a stock Mac does not have" >&2
              exit 1
            fi
          fi

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          RUN=./bpp-seqs
          if [ "${{ matrix.target }}" = macos-x86_64 ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then RUN="arch -x86_64 ./bpp-seqs"
            else echo "No Rosetta on this runner; skipping the x86_64 smoke test"; exit 0; fi
          fi
          $RUN --version
          B="$PWD/bpp-seqs"; R="${RUN%./bpp-seqs}$B"
          for ex in 01-fasta-anastrepha 02-phylip-ascidian 03-nexus-milksnake; do
            ( cd "examples/$ex" && $R loci/* --imap imap.txt --out "$RUNNER_TEMP/$ex" --quiet \
              && test -s "$RUNNER_TEMP/$ex.txt" && echo "$ex ok" )
          done
          d=tests/data
          $R $d/ind1.bam $d/ind2.bam $d/ind3.bam $d/ind4.bam $d/test_ref.fa $d/loci.bed \
             --imap $d/imap.txt --out "$RUNNER_TEMP/bam" --quiet && test -s "$RUNNER_TEMP/bam.txt" && echo "bam ok"
          # No CRAM here: the test CRAMs name their reference by an absolute path
          # from the machine that made them, and the reference given on the
          # command line is not used to decode CRAM (to be fixed separately).

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="bpp-seqs-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp bpp-seqs README.md LICENSE "$STAGE/"
          cp -r examples "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: bpp-seqs-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256 checksums
        run: |
          cd dist
          sha256sum bpp-seqs-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bpp-seqs-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  bump-homebrew:
    name: Bump Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    # Skip pre-release tags (anything with a '-', e.g. v0.1.0-rc1).
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      # The formula builds from the source tarball (depends_on "htslib"), so its
      # sha256 is the checksum of the GitHub source archive, not the release
      # binary. HOMEBREW_TAP_TOKEN2 is a PAT with Contents:write on
      # bpp/homebrew-tap. Formula/bpp-seqs.rb must already exist in the tap
      # (seeded once from packaging/bpp-seqs.rb in this repo).
      - name: Bump formula in bpp/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN2 }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          URL="https://github.com/bpp/bpp-seqs/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL -o src.tar.gz "$URL"
          SHA="$(sha256sum src.tar.gz | awk '{print $1}')"
          echo "bumping formula to ${VER} (sha256 ${SHA})"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/bpp/homebrew-tap.git" tap
          cd tap
          python3 - "$URL" "$SHA" <<'PY'
          import re, sys
          url, sha = sys.argv[1], sys.argv[2]
          path = "Formula/bpp-seqs.rb"
          s = open(path).read()
          s = re.sub(r'^(\s*)url ".*"$', lambda m: m.group(1) + f'url "{url}"',
                     s, count=1, flags=re.M)
          s = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{sha}"', s, count=1)
          open(path, "w").write(s)
          PY
          git config user.name  "bpp-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formula already at ${VER}; nothing to do."
            exit 0
          fi
          git commit -am "bpp-seqs ${VER}"
          git push origin HEAD:main
